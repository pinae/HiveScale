[project]
name = "hivescale-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "djangorestframework>=3.16",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "drf-spectacular>=0.30.0",
    "celery[redis]>=5.6.3",
    "google-genai>=2.14.0",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "hypothesis>=6.157.0",
    "numpy>=2.5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "external: hits real third-party APIs; excluded from CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]  # generated code

[tool.coverage.run]
source = ["core", "config", "bglib"]
