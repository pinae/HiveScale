# Production nginx config, baked into frontend/Dockerfile.prod.
#
# This nginx is a plain HTTP server behind Traefik — Traefik terminates TLS and
# routes by Host, so there is no 443 listener, no certificates, and server_name
# is a catch-all. The upstream is the compose *service* name `backend`, which
# resolves on the shared compose network. Static/media are served from the
# volumes the backend also mounts (see the compose template).

upstream backend_server {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    # Single-page app.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django (API, admin, drf-spectacular schema). X-Forwarded-Proto carries the
    # value Traefik set, which Django trusts via SECURE_PROXY_SSL_HEADER.
    location ~ ^/(api|admin|accounts)/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django collectstatic output (admin/DRF assets), shared via a volume.
    location /static/ {
        alias /app/static/;
    }

    # Uploaded media (future image Things), shared via a volume.
    location /media/ {
        alias /app/media/;
    }
}
