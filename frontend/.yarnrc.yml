nodeLinker: node-modules

enableTelemetry: false

# Storybook 8.6 / eslint-plugin-storybook ship transitive deps with missing
# peer declarations (YN0086). These extensions declare the peers they actually
# need; all of them are provided by our root dependencies.
packageExtensions:
  "@storybook/addon-essentials@*":
    peerDependencies:
      "@types/react": "*"
  "@storybook/addon-docs@*":
    peerDependencies:
      "@types/react": "*"
  "@storybook/core@*":
    peerDependencies:
      storybook: "*"
  "@storybook/react-vite@*":
    peerDependencies:
      typescript: "*"
  eslint-plugin-storybook@*:
    peerDependencies:
      typescript: "*"
