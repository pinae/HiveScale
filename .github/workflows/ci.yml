name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hivescale
          POSTGRES_USER: hivescale
          POSTGRES_PASSWORD: hivescale-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hivescale"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://hivescale:hivescale-ci@localhost:5432/hivescale
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (frozen to uv.lock)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests (pytest, external APIs excluded)
        run: uv run pytest -m "not external" --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack (activates the pinned Yarn 4)
        run: corepack enable
      - name: Install (immutable)
        run: yarn install --immutable
      - name: Lint (eslint)
        run: yarn lint
      - name: Typecheck (tsc)
        run: yarn tsc -b
      - name: Unit tests (vitest)
        run: yarn test
      - name: Storybook build (component workshop must stay green)
        run: yarn build-storybook --quiet

  e2e:
    # WP-12: Playwright drives the real SPA in Chromium. The mocked UI suite and
    # the real-backend suite (isolated sqlite, Gemini faked, no Redis) both run;
    # Playwright boots both web servers itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack (activates the pinned Yarn 4)
        run: corepack enable
      - name: Install uv (for the backend web server)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync backend dependencies (frozen to uv.lock)
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend deps (immutable)
        working-directory: frontend
        run: yarn install --immutable
      - name: Install Playwright Chromium
        working-directory: frontend
        run: yarn playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: yarn e2e
      - name: Upload Playwright report & traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
