name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wavelength
          POSTGRES_USER: wavelength
          POSTGRES_PASSWORD: wavelength-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wavelength"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://wavelength:wavelength-ci@localhost:5432/wavelength
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest, external APIs excluded)
        run: pytest -m "not external" --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npx eslint .
      - name: Typecheck (tsc)
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Storybook build (component workshop must stay green)
        run: npm run build-storybook -- --quiet
      # WP-12 adds: storybook test-runner + Playwright e2e against docker compose.
