services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hivescale}
      POSTGRES_USER: ${POSTGRES_USER:-hivescale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivescale-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivescale}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hivescale}:${POSTGRES_PASSWORD:-hivescale-dev}@db:5432/${POSTGRES_DB:-hivescale}
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # Dev: graduate to the human baseline after just a few answers so the
      # animated crowd histogram shows up quickly (production default is 15).
      GRADUATION_MIN_ANSWERS: ${GRADUATION_MIN_ANSWERS:-3}
      # Dev: unlock the level-gated features early so the flows are reachable
      # without grinding (production defaults are 3 / 5 / 10 / 15).
      CONTENT_DAILY_WAVE_LEVEL: ${CONTENT_DAILY_WAVE_LEVEL:-1}
      CONTENT_VOTE_LEVEL: ${CONTENT_VOTE_LEVEL:-2}
      CONTENT_CHALLENGE_LEVEL: ${CONTENT_CHALLENGE_LEVEL:-3}
      CONTENT_SCALE_LEVEL: ${CONTENT_SCALE_LEVEL:-4}
      CONTENT_SCALE_MIN_ROUNDS: ${CONTENT_SCALE_MIN_ROUNDS:-2}
      # Email / SMTP for account-claim magic links. Injected from Ansible in
      # production; defaults here keep dev on echo delivery (token in the API
      # response, no mail sent). To go live set CLAIM_LINK_DELIVERY=email and the
      # EMAIL_* / PUBLIC_BASE_URL vars. RUB: STARTTLS + password auth,
      # EMAIL_HOST=mail.ruhr-uni-bochum.de EMAIL_PORT=587 EMAIL_HOST_USER=hivesx98.
      CLAIM_LINK_DELIVERY: ${CLAIM_LINK_DELIVERY:-echo}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      EMAIL_SECURITY: ${EMAIL_SECURITY:-starttls}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-HiveScale <noreply@localhost>}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    command: yarn dev --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
